[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; OTA-capable partition scheme: dual-bank app partitions
board_build.partitions = partitions_dual_ota.csv

; CPU frequency: upper bound for dynamic frequency scaling
board_build.f_cpu = 240000000L

; Libraries
lib_deps =

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_PM_ENABLE=1
    -DCONFIG_ESP32_DPORT_WORKAROUND=1
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_CLASSIC_BT_ENABLED=1
    -DCONFIG_BT_BLE_ENABLED=0
    -DCONFIG_BT_CTRL_MODEM_SLEEP=0

[env:native]
platform = native
lib_deps = unity
test_build_src = yes

build_src_filter =
    +<../src/sensor/quaternion.cpp>
    +<../src/sensor/madgwick.cpp>
    +<../src/sensor/calibration.cpp>
    +<../src/storage/crc.cpp>
    +<../test/test_all.cpp>
    -<../src/main.cpp>
    -<../src/native_main.cpp>

build_flags =
    -DUNITY_FAST_IO_ALL
    -DTEST_BUILD
    -I..
    -I../src
    -I../src/sensor
    -I../src/storage
    -I../test/native
    -Itest/native
    -DUNITY_INCLUDE_CONFIG_H
