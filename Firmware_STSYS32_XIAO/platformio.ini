; STSYS32 — STSYS Firmware for Seeed XIAO nRF52840 Sense
; Migrated from dylemmas/STASYS_SEEEDXIAO
; Hardware: Seeed XIAO nRF52840 Sense + LSM6DS3 + PDM Mic

[platformio]
default_envs = xiaoblesense

[env:xiaoblesense]
platform = nordicnrf52
board = xiaoblesense
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_src_flags = -Wl,--undefined=imu -Wl,--undefined=madgwick

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBUILD_TYPE_STSYS32_XIAO

lib_deps =
    seeed-studio/Seeed Arduino LSM6DS3@^2.0.5
    adafruit/Adafruit Bluefruit nRF52@^1.8.2
    arduino-libraries/Madgwick@^1.2.0
    adafruit/Adafruit Zero PDM Library@^1.2.4

lib_ldf_mode = deep+

; =============================================================================
; NATIVE TEST ENVIRONMENT
; Runs unit tests on your host PC (no hardware required)
; Run with: pio test -e native   (NOT: pio run -e native)
; NOTE: The native environment uses a MinGW toolchain on Windows/MSYS2 which
; requires running tests via `pio test` (not `pio run`) due to console
; subsystem entry point handling.
; =============================================================================
[env:native]
platform = native
build_type = debug
test_framework = unity

# NOTE: Use `pio test -e native` to run tests.
# The MinGW toolchain on this MSYS2/Windows setup requires console subsystem.
build_flags =
    -DPLATFORMIO_NATIVE_TEST=1
    -mconsole
    -Wl,--subsystem,console
    -Itest/mocks
    -Isrc
    -Iinclude
    -Itest

build_src_filter =
    -<main.cpp>
    -<IMU.cpp>
    -<PDM.cpp>
    -<power.cpp>
    +<globals.cpp>
    +<math.cpp>
    +<state.cpp>

lib_deps =
    Unity
